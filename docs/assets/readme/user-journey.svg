<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">You, JuTell, and your coding agent working both ways</title>
  <desc id="desc">Before work, JuTell clarifies what you mean with your coding agent. After work, JuTell explains what the agent did. You stay in the middle of both directions.</desc>
  <rect width="1200" height="420" fill="#f6f8fa"/>

  <!-- three nodes -->
  <g font-family="Arial, sans-serif">
    <rect x="60" y="130" width="300" height="120" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="210" y="182" text-anchor="middle" fill="#24292f" font-size="30" font-weight="700">You</text>
    <text x="210" y="214" text-anchor="middle" fill="#57606a" font-size="17">say it normally</text>

    <rect x="450" y="130" width="300" height="120" rx="16" fill="#0969da"/>
    <text x="600" y="182" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">JuTell</text>
    <text x="600" y="214" text-anchor="middle" fill="#d0e7ff" font-size="17">both directions</text>

    <rect x="840" y="130" width="300" height="120" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="990" y="182" text-anchor="middle" fill="#24292f" font-size="30" font-weight="700">Coding agent</text>
    <text x="990" y="214" text-anchor="middle" fill="#57606a" font-size="17">Codex, Claude, OpenCode</text>
  </g>

  <!-- bidirectional arrows: before work (top) -->
  <g stroke="#0969da" stroke-width="2.5" fill="none">
    <path d="M360 158 L450 158"/>
    <path d="M450 172 L360 172"/>
    <path d="M750 158 L840 158"/>
    <path d="M840 172 L750 172"/>
  </g>
  <g fill="#0969da">
    <polygon points="450,158 436,150 436,166"/>
    <polygon points="360,172 374,164 374,180"/>
    <polygon points="840,158 826,150 826,166"/>
    <polygon points="750,172 764,164 764,180"/>
  </g>

  <!-- labels -->
  <g font-family="Arial, sans-serif">
    <text x="600" y="60" text-anchor="middle" fill="#24292f" font-size="24" font-weight="700">Before work: what you actually mean</text>
    <text x="600" y="90" text-anchor="middle" fill="#57606a" font-size="17">only real decisions are asked — project facts are checked, not asked</text>
    <text x="600" y="310" text-anchor="middle" fill="#24292f" font-size="24" font-weight="700">After work: what it actually did</text>
    <text x="600" y="340" text-anchor="middle" fill="#57606a" font-size="17">verified, expected, and still unknown — kept separate</text>
  </g>

  <text x="600" y="386" text-anchor="middle" fill="#57606a" font-family="Arial, sans-serif" font-size="17">JuTell does not replace your agent or guarantee its answers — it keeps both directions honest.</text>
</svg>
