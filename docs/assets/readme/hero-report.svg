<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">JuTell explains both directions of a coding agent conversation</title>
  <desc id="desc">Before work, JuTell checks project facts and asks only the decision that changes the result. After work, JuTell reports what changed, what was verified, and what is not checked yet.</desc>
  <rect width="1200" height="560" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="66" fill="#24292f" font-size="32" font-weight="700">Tell your agent what you mean.</text>
    <text x="60" y="104" fill="#24292f" font-size="32" font-weight="700">Understand what it did.</text>

    <rect x="60" y="150" width="520" height="360" rx="18" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="92" y="196" fill="#0969da" font-size="22" font-weight="700">BEFORE WORK</text>
    <text x="92" y="234" fill="#24292f" font-size="20">Checks project facts first, then asks</text>
    <text x="92" y="260" fill="#24292f" font-size="20">only the decision that changes the result.</text>
    <rect x="92" y="292" width="456" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
    <text x="112" y="328" fill="#24292f" font-size="19" font-weight="700">PROJECT FACTS CHECKED FIRST</text>
    <rect x="92" y="368" width="456" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
    <text x="112" y="404" fill="#24292f" font-size="19" font-weight="700">ONE QUESTION — ONLY IF IT MATTERS</text>
    <text x="92" y="464" fill="#57606a" font-size="16">Real example below ↓</text>

    <rect x="620" y="150" width="520" height="360" rx="18" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="652" y="196" fill="#9a6700" font-size="22" font-weight="700">AFTER WORK</text>
    <text x="652" y="234" fill="#24292f" font-size="20">Separates what's confirmed from what's</text>
    <text x="652" y="260" fill="#24292f" font-size="20">expected — before calling anything done.</text>
    <rect x="652" y="292" width="220" height="46" rx="8" fill="#dafbe1"/><text x="672" y="321" fill="#1a7f37" font-size="17" font-weight="700">✓ VERIFIED</text>
    <rect x="884" y="292" width="220" height="46" rx="8" fill="#ffebe9"/><text x="900" y="321" fill="#cf222e" font-size="17" font-weight="700">? NOT CHECKED</text>
    <text x="652" y="374" fill="#24292f" font-size="19">Ran the actual test suite, re-read the</text>
    <text x="652" y="399" fill="#24292f" font-size="19">edited file — never guesses "it works."</text>
    <text x="652" y="464" fill="#57606a" font-size="16">Real report below ↓</text>
  </g>
</svg>
