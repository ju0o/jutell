<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">JuTell은 Coding Agent 대화의 양쪽 방향을 모두 설명합니다</title>
  <desc id="desc">작업 전에는 프로젝트 사실을 먼저 확인하고 결과를 바꾸는 결정만 묻습니다. 작업 후에는 무엇이 바뀌었는지, 무엇을 확인했는지, 아직 확인하지 못한 것은 무엇인지 알려줍니다.</desc>
  <rect width="1200" height="560" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="66" fill="#24292f" font-size="30" font-weight="700">내가 하려는 말을 Agent에게,</text>
    <text x="60" y="104" fill="#24292f" font-size="30" font-weight="700">Agent가 한 일을 나에게.</text>

    <rect x="60" y="150" width="520" height="360" rx="18" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="92" y="196" fill="#0969da" font-size="22" font-weight="700">작업 전</text>
    <text x="92" y="234" fill="#24292f" font-size="20">프로젝트 사실을 먼저 확인한 뒤,</text>
    <text x="92" y="260" fill="#24292f" font-size="20">결과를 정말 바꾸는 결정만 물어요.</text>
    <rect x="92" y="292" width="456" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
    <text x="112" y="328" fill="#24292f" font-size="19" font-weight="700">프로젝트 사실 먼저 확인</text>
    <rect x="92" y="368" width="456" height="60" rx="10" fill="#fff" stroke="#d0d7de"/>
    <text x="112" y="404" fill="#24292f" font-size="19" font-weight="700">필요할 때만 질문 한 번</text>
    <text x="92" y="464" fill="#57606a" font-size="16">실제 예시는 아래에 ↓</text>

    <rect x="620" y="150" width="520" height="360" rx="18" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="652" y="196" fill="#9a6700" font-size="22" font-weight="700">작업 후</text>
    <text x="652" y="234" fill="#24292f" font-size="20">확인된 것과 예상한 것을 나눠서,</text>
    <text x="652" y="260" fill="#24292f" font-size="20">"됐다"고 미리 말하지 않아요.</text>
    <rect x="652" y="292" width="220" height="46" rx="8" fill="#dafbe1"/><text x="672" y="321" fill="#1a7f37" font-size="17" font-weight="700">✓ 확인됨</text>
    <rect x="884" y="292" width="220" height="46" rx="8" fill="#ffebe9"/><text x="900" y="321" fill="#cf222e" font-size="17" font-weight="700">? 미확인</text>
    <text x="652" y="374" fill="#24292f" font-size="19">실제 테스트를 실행하고 바뀐 파일을</text>
    <text x="652" y="399" fill="#24292f" font-size="19">다시 읽어 확인해요 — 짐작하지 않아요.</text>
    <text x="652" y="464" fill="#57606a" font-size="16">실제 보고서는 아래에 ↓</text>
  </g>
</svg>
