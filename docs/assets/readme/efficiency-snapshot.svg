<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">One observed run, with and without JuTell</title>
  <desc id="desc">A single bounded comparison on the same small task, same provider: without JuTell, 8 tool actions and about 63.7 thousand provider-reported tokens with a 4-line result; with JuTell, 13 tool actions and about 160.4 thousand tokens with a structured report. This is one sample, not a benchmark.</desc>
  <rect width="1200" height="480" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="56" fill="#24292f" font-size="28" font-weight="700">One observed run — not a benchmark</text>
    <text x="60" y="86" fill="#57606a" font-size="17">Same small task, same provider, run once with JuTell and once without. n = 1.</text>

    <rect x="60" y="110" width="520" height="230" rx="16" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="146" fill="#57606a" font-size="19" font-weight="700">WITHOUT JUTELL</text>
    <text x="92" y="196" fill="#24292f" font-size="34" font-weight="700">8 actions</text>
    <text x="92" y="232" fill="#24292f" font-size="24">≈ 63.7k tokens</text>
    <text x="92" y="268" fill="#57606a" font-size="18">Result: a 4-line summary.</text>
    <text x="92" y="308" fill="#57606a" font-size="16">Provider-reported (OpenCode), one sample.</text>

    <rect x="620" y="110" width="520" height="230" rx="16" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="652" y="146" fill="#0969da" font-size="19" font-weight="700">WITH JUTELL</text>
    <text x="652" y="196" fill="#24292f" font-size="34" font-weight="700">13 actions</text>
    <text x="652" y="232" fill="#24292f" font-size="24">≈ 160.4k tokens</text>
    <text x="652" y="268" fill="#57606a" font-size="18">Result: a structured, verified report.</text>
    <text x="652" y="308" fill="#57606a" font-size="16">+3 JuTell-specific reads/calls (config, Skill, MCP).</text>

    <rect x="60" y="360" width="1080" height="96" rx="14" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="92" y="392" fill="#9a6700" font-size="18" font-weight="700">Where the overhead came from</text>
    <text x="92" y="420" fill="#24292f" font-size="18">Mostly one full Skill-file read per fresh agent process — an active area we're working to reduce.</text>
    <text x="92" y="444" fill="#57606a" font-size="16">One bounded OpenCode sample. Codex's own token profile was not measured this run.</text>
  </g>
</svg>
