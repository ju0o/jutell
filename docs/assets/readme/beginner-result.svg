<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">A technical result becomes a plain JuTell result</title>
  <desc id="desc">A raw technical agent message on the left is replaced by changed, verified, not checked, and next action on the right.</desc>
  <rect width="1200" height="570" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif"><text x="60" y="70" fill="#24292f" font-size="36" font-weight="700">Know what happened without decoding a technical message.</text>
    <rect x="55" y="125" width="450" height="360" rx="18" fill="#24292f"/><text x="90" y="175" fill="#d0d7de" font-size="22" font-weight="700">NORMAL AGENT RESULT</text><text x="90" y="225" fill="#f0f6fc" font-size="21">Updated SignupForm.tsx</text><text x="90" y="265" fill="#8b949e" font-size="19">refactor layout / ran test</text><text x="90" y="305" fill="#8b949e" font-size="19">adjusted styles / no issues</text><text x="90" y="385" fill="#f0f6fc" font-size="23">What does that mean for me?</text>
    <path d="M535 305h110" stroke="#0969da" stroke-width="7"/><polygon points="675,305 645,288 645,322" fill="#0969da"/>
    <rect x="695" y="125" width="450" height="360" rx="18" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="730" y="175" fill="#0969da" font-size="22" font-weight="700">JUTELL RESULT</text><text x="730" y="230" fill="#1a7f37" font-size="20" font-weight="700">CHANGED</text><text x="730" y="258" fill="#24292f" font-size="21">Signup spacing is simpler.</text><text x="730" y="312" fill="#1a7f37" font-size="20" font-weight="700">VERIFIED</text><text x="730" y="340" fill="#24292f" font-size="21">The signup test passed.</text><text x="730" y="394" fill="#9a6700" font-size="20" font-weight="700">NOT CHECKED</text><text x="730" y="422" fill="#24292f" font-size="21">Browser view was not opened.</text><text x="730" y="465" fill="#0969da" font-size="20" font-weight="700">NEXT</text><text x="805" y="465" fill="#24292f" font-size="21">Open signup once.</text>
  </g>
</svg>
