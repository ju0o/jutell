<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">A real JuTell run: one grounded question, then a finished result</title>
  <desc id="desc">Condensed from an actual JuTell session (translated from Korean). The user asks to simplify signup. JuTell checks the real signup form, asks the one question that changes the result, then the coding agent works and JuTell reports the outcome, including a side effect the user did not ask about.</desc>
  <rect width="1200" height="840" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="56" fill="#24292f" font-size="30" font-weight="700">See it in action</text>
    <text x="60" y="88" fill="#57606a" font-size="18">Condensed from a real JuTell run · translated from Korean</text>

    <rect x="60" y="112" width="760" height="80" rx="16" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="145" fill="#57606a" font-size="18" font-weight="700">YOU</text>
    <text x="92" y="174" fill="#24292f" font-size="23">"Please make signup simpler."</text>

    <path d="M450 192v34" stroke="#0969da" stroke-width="5"/><polygon points="450,240 438,222 462,222" fill="#0969da"/>

    <rect x="60" y="252" width="1080" height="72" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="282" fill="#57606a" font-size="17" font-weight="700">JUTELL CHECKS THE PROJECT FIRST</text>
    <text x="92" y="308" fill="#24292f" font-size="19">Reads the real signup form: 3 required fields, 3 optional fields, 3 screen sections.</text>

    <path d="M600 324v34" stroke="#0969da" stroke-width="5"/><polygon points="600,372 588,354 612,354" fill="#0969da"/>

    <rect x="60" y="384" width="1080" height="112" rx="16" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="92" y="416" fill="#0969da" font-size="18" font-weight="700">JUTELL ASKS ONE QUESTION</text>
    <text x="92" y="446" fill="#24292f" font-size="21">"Should I remove only the optional fields (phone, nickname, marketing</text>
    <text x="92" y="472" fill="#24292f" font-size="21">opt-in), or also reduce required fields like password confirmation?"</text>

    <path d="M600 496v34" stroke="#0969da" stroke-width="5"/><polygon points="600,544 588,526 612,526" fill="#0969da"/>

    <rect x="60" y="556" width="760" height="72" rx="16" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="586" fill="#57606a" font-size="17" font-weight="700">YOU</text>
    <text x="92" y="613" fill="#24292f" font-size="21">"Just remove the optional fields. Keep everything required."</text>

    <path d="M450 628v30" stroke="#0969da" stroke-width="5"/><polygon points="450,672 438,654 462,654" fill="#0969da"/>

    <rect x="60" y="684" width="500" height="132" rx="16" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="92" y="716" fill="#1a7f37" font-size="18" font-weight="700">CODING AGENT WORKS</text>
    <text x="92" y="746" fill="#24292f" font-size="19">Removes the 3 optional fields.</text>
    <text x="92" y="770" fill="#24292f" font-size="19">Required fields and validation</text>
    <text x="92" y="794" fill="#24292f" font-size="19">logic are left untouched.</text>

    <rect x="580" y="684" width="560" height="132" rx="16" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="612" y="716" fill="#9a6700" font-size="18" font-weight="700">JUTELL RESULT</text>
    <text x="612" y="746" fill="#24292f" font-size="19">Fields 6 → 3 · steps 3 → 1 · 2/2 tests passed.</text>
    <text x="612" y="774" fill="#cf222e" font-size="18" font-weight="700">Flags on its own:</text>
    <text x="612" y="798" fill="#24292f" font-size="18">marketing opt-in was removed too.</text>
  </g>
</svg>
