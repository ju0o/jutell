<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">실제 JuTell 보고서를 이 페이지 크기로 요약함</title>
  <desc id="desc">실제 JuTell 실행 결과 요약: 로그인 버튼 문구를 바꾸고 로그인 기능은 그대로 두었습니다. 파일을 다시 읽고 기존 테스트를 실행해 확인했으며, 위험도는 낮고 사용자가 확인할 일이 하나 남았습니다.</desc>
  <rect width="1200" height="600" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="60" fill="#24292f" font-size="30" font-weight="700">가짜가 아닌 실제 결과예요</text>
    <text x="60" y="92" fill="#57606a" font-size="18">실제 JuTell 실행을 요약함 — 요청: "로그인 버튼 문구를 '시작하기'로</text>
    <text x="60" y="116" fill="#57606a" font-size="18">바꿔줘. 기능은 그대로 유지해."</text>

    <rect x="60" y="140" width="1080" height="430" rx="18" fill="#fff" stroke="#d0d7de" stroke-width="2"/>

    <text x="96" y="184" fill="#1a7f37" font-size="21" font-weight="700">바뀐 것</text>
    <text x="96" y="212" fill="#24292f" font-size="20">한 파일의 로그인 버튼 문구만 바뀌었어요. 버튼 ID와 클릭 동작은 그대로예요.</text>

    <rect x="96" y="234" width="1008" height="2" fill="#d0d7de"/>

    <text x="96" y="270" fill="#1a7f37" font-size="21" font-weight="700">확인한 것</text>
    <text x="96" y="298" fill="#24292f" font-size="20">바뀐 파일을 직접 다시 읽었어요. 기존 테스트 2개를 실행해 모두 통과했어요.</text>

    <rect x="96" y="320" width="1008" height="2" fill="#d0d7de"/>

    <text x="96" y="356" fill="#9a6700" font-size="21" font-weight="700">위험도 — 낮음</text>
    <text x="96" y="384" fill="#24292f" font-size="20">버튼 문구만 바뀌었고 로그인 처리 로직은 손대지 않았어요.</text>

    <rect x="96" y="406" width="1008" height="2" fill="#d0d7de"/>

    <text x="96" y="442" fill="#0969da" font-size="21" font-weight="700">여러분이 할 일</text>
    <text x="96" y="470" fill="#24292f" font-size="20">버튼을 한 번 눌러 로그인이 잘 되는지 확인해 주세요.</text>

    <rect x="96" y="496" width="1008" height="50" rx="10" fill="#f6f8fa"/>
    <text x="116" y="527" fill="#57606a" font-size="17">전체 원문 보고서 → docs/releases/2.0.0-showcase.md</text>
  </g>
</svg>
