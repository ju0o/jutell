<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">사용자와 JuTell, Coding Agent가 양방향으로 함께 동작합니다</title>
  <desc id="desc">작업 전에는 JuTell이 사용자의 말을 Agent와 함께 분명하게 만듭니다. 작업 후에는 JuTell이 Agent가 한 일을 설명합니다. 사용자는 양쪽 방향의 중심에 있습니다.</desc>
  <rect width="1200" height="420" fill="#f6f8fa"/>

  <!-- three nodes -->
  <g font-family="Arial, sans-serif">
    <rect x="60" y="130" width="300" height="120" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="210" y="182" text-anchor="middle" fill="#24292f" font-size="30" font-weight="700">사용자</text>
    <text x="210" y="214" text-anchor="middle" fill="#57606a" font-size="17">평소 말대로 요청</text>

    <rect x="450" y="130" width="300" height="120" rx="16" fill="#0969da"/>
    <text x="600" y="182" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">JuTell</text>
    <text x="600" y="214" text-anchor="middle" fill="#d0e7ff" font-size="17">양쪽 방향을 연결</text>

    <rect x="840" y="130" width="300" height="120" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="990" y="182" text-anchor="middle" fill="#24292f" font-size="30" font-weight="700">Coding Agent</text>
    <text x="990" y="214" text-anchor="middle" fill="#57606a" font-size="17">Codex, Claude, OpenCode</text>
  </g>

  <!-- bidirectional arrows: before work (top) -->
  <g stroke="#0969da" stroke-width="2.5" fill="none">
    <path d="M360 158 L450 158"/>
    <path d="M450 172 L360 172"/>
    <path d="M750 158 L840 158"/>
    <path d="M840 172 L750 172"/>
  </g>
  <g fill="#0969da">
    <polygon points="450,158 436,150 436,166"/>
    <polygon points="360,172 374,164 374,180"/>
    <polygon points="840,158 826,150 826,166"/>
    <polygon points="750,172 764,164 764,180"/>
  </g>

  <!-- labels -->
  <g font-family="Arial, sans-serif">
    <text x="600" y="60" text-anchor="middle" fill="#24292f" font-size="24" font-weight="700">작업 전: 진짜 원하는 게 뭔지</text>
    <text x="600" y="90" text-anchor="middle" fill="#57606a" font-size="17">진짜 결정만 묻고 — 확인할 수 있는 사실은 직접 확인합니다</text>
    <text x="600" y="310" text-anchor="middle" fill="#24292f" font-size="24" font-weight="700">작업 후: 실제로 뭘 했는지</text>
    <text x="600" y="340" text-anchor="middle" fill="#57606a" font-size="17">확인됨·예상·미확인을 나눠서 보여줍니다</text>
  </g>

  <text x="600" y="386" text-anchor="middle" fill="#57606a" font-family="Arial, sans-serif" font-size="17">JuTell은 Agent를 대신하지도, 그 답을 보증하지도 않습니다 — 양쪽 방향을 정직하게 이어줍니다.</text>
</svg>
