<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">JuTell을 설치하는 다섯 단계</title>
  <desc id="desc">터미널을 열고 JuTell을 설치한 뒤 jutell을 실행합니다. Agent 연결을 승인하고 평소 쓰던 Coding Agent로 돌아갑니다.</desc>
  <rect width="1200" height="500" fill="#f6f8fa"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif">
    <text x="60" y="72" fill="#24292f" font-size="36" font-weight="700">작은 다섯 단계 뒤, 평소 Agent로 돌아가세요.</text>
    <g fill="#fff" stroke="#d0d7de" stroke-width="2"><rect x="50" y="145" width="205" height="220" rx="18"/><rect x="275" y="145" width="205" height="220" rx="18"/><rect x="500" y="145" width="205" height="220" rx="18"/><rect x="725" y="145" width="205" height="220" rx="18"/><rect x="950" y="145" width="205" height="220" rx="18"/></g>
    <g text-anchor="middle"><g fill="#0969da"><circle cx="152" cy="182" r="24"/><circle cx="377" cy="182" r="24"/><circle cx="602" cy="182" r="24"/><circle cx="827" cy="182" r="24"/><circle cx="1052" cy="182" r="24"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="152" y="190">1</text><text x="377" y="190">2</text><text x="602" y="190">3</text><text x="827" y="190">4</text><text x="1052" y="190">5</text></g><g fill="#24292f" font-size="22" font-weight="700"><text x="152" y="242">터미널 열기</text><text x="377" y="242">설치</text><text x="602" y="242">실행</text><text x="827" y="242">승인</text><text x="1052" y="242">완료</text></g><g fill="#57606a" font-size="18"><text x="152" y="280">PowerShell</text><text x="152" y="304">또는 Terminal</text><text x="377" y="280">npm install</text><text x="377" y="304">-g jutell</text><text x="602" y="280">jutell</text><text x="827" y="280">Agent 발견</text><text x="827" y="304">연결 승인</text><text x="1052" y="280">평소 Agent로</text><text x="1052" y="304">돌아가기</text></g></g>
    <path d="M255 255h20m205 0h20m205 0h20m205 0h20" stroke="#0969da" stroke-width="5"/>
    <text x="600" y="435" text-anchor="middle" fill="#57606a" font-size="22">JuTell은 이미 설치한 Coding Agent에 연결합니다.</text>
  </g>
</svg>
