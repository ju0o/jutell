<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">실제 JuTell 실행: 근거 있는 질문 한 번, 그리고 끝난 결과</title>
  <desc id="desc">실제 JuTell 세션에서 요약. 회원가입을 간단하게 해달라는 요청에 JuTell이 실제 가입 화면을 먼저 확인하고, 결과를 바꾸는 질문 한 가지만 물은 뒤, Coding Agent가 작업하고 JuTell이 사용자가 묻지 않은 부작용까지 포함해 결과를 알려줍니다.</desc>
  <rect width="1200" height="840" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="56" fill="#24292f" font-size="30" font-weight="700">실제로 이렇게 동작해요</text>
    <text x="60" y="88" fill="#57606a" font-size="18">실제 JuTell 실행 결과를 요약함</text>

    <rect x="60" y="112" width="760" height="80" rx="16" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="145" fill="#57606a" font-size="18" font-weight="700">나</text>
    <text x="92" y="174" fill="#24292f" font-size="23">"회원가입 좀 간단하게 해줘."</text>

    <path d="M450 192v34" stroke="#0969da" stroke-width="5"/><polygon points="450,240 438,222 462,222" fill="#0969da"/>

    <rect x="60" y="252" width="1080" height="72" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="282" fill="#57606a" font-size="17" font-weight="700">JUTELL이 프로젝트를 먼저 확인해요</text>
    <text x="92" y="308" fill="#24292f" font-size="19">실제 가입 화면을 확인: 필수 3개, 선택 3개, 화면 3단계.</text>

    <path d="M600 324v34" stroke="#0969da" stroke-width="5"/><polygon points="600,372 588,354 612,354" fill="#0969da"/>

    <rect x="60" y="384" width="1080" height="112" rx="16" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="92" y="416" fill="#0969da" font-size="18" font-weight="700">JUTELL이 한 가지만 물어요</text>
    <text x="92" y="446" fill="#24292f" font-size="20">"선택 항목(전화번호, 닉네임, 마케팅 동의)만 빼고 정리할까요,</text>
    <text x="92" y="472" fill="#24292f" font-size="20">아니면 비밀번호 확인 같은 필수 항목까지 줄일까요?"</text>

    <path d="M600 496v34" stroke="#0969da" stroke-width="5"/><polygon points="600,544 588,526 612,526" fill="#0969da"/>

    <rect x="60" y="556" width="760" height="72" rx="16" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="92" y="586" fill="#57606a" font-size="17" font-weight="700">나</text>
    <text x="92" y="613" fill="#24292f" font-size="20">"선택 항목만 빼주세요. 필수 항목은 유지해주세요."</text>

    <path d="M450 628v30" stroke="#0969da" stroke-width="5"/><polygon points="450,672 438,654 462,654" fill="#0969da"/>

    <rect x="60" y="684" width="500" height="132" rx="16" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="92" y="716" fill="#1a7f37" font-size="18" font-weight="700">CODING AGENT가 작업해요</text>
    <text x="92" y="746" fill="#24292f" font-size="19">선택 항목 3개를 없앱니다.</text>
    <text x="92" y="770" fill="#24292f" font-size="19">필수 입력과 검증 로직은</text>
    <text x="92" y="794" fill="#24292f" font-size="19">그대로 둡니다.</text>

    <rect x="580" y="684" width="560" height="132" rx="16" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="612" y="716" fill="#9a6700" font-size="18" font-weight="700">JUTELL 결과</text>
    <text x="612" y="746" fill="#24292f" font-size="19">입력 6→3 · 단계 3→1 · 테스트 2/2 통과.</text>
    <text x="612" y="774" fill="#cf222e" font-size="18" font-weight="700">먼저 알려준 것:</text>
    <text x="612" y="798" fill="#24292f" font-size="18">마케팅 동의 항목도 함께 없어졌어요.</text>
  </g>
</svg>
